<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Data model after migrations 0001–0008"><rect width="1200" height="600" fill="#0f1115"/><text x="32" y="38" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#e8ecf3">Data model after migrations 0001–0008</text><text x="32" y="60" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" fill="#9aa4b2">MySQL 8.4, utf8mb4. Primary keys in bold; arrows show foreign keys.</text><defs><marker id="ah-6aa9ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6aa9ff"/></marker><marker id="ah-3ddc97" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3ddc97"/></marker><marker id="ah-ffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="ah-ff2d78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2d78"/></marker><marker id="ah-9aa4b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4b2"/></marker></defs><rect x="40" y="100" width="330" height="186" rx="10" fill="#171a21" stroke="#3a4150"/><rect x="40" y="100" width="330" height="30" rx="10" fill="#1e222b"/><text x="52" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#e8ecf3">credentials</text><text x="52" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#e8ecf3">id  INT PK</text><text x="52" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">username  VARCHAR(32) UNIQUE</text><text x="52" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">password_hash  VARCHAR(255)</text><text x="52" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">role  ENUM('admin','operator','viewer')</text><text x="52" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">disabled  TINYINT(1)</text><text x="52" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">created_at, updated_at</text><text x="52" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">last_login_at</text><rect x="40" y="300" width="330" height="146" rx="10" fill="#171a21" stroke="#3a4150"/><rect x="40" y="300" width="330" height="30" rx="10" fill="#1e222b"/><text x="52" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#e8ecf3">sessions</text><text x="52" y="350" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#e8ecf3">id  CHAR(64) PK (hash of cookie)</text><text x="52" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#e8ecf3">credential_id  FK → credentials.id</text><text x="52" y="390" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">created_at, expires_at</text><text x="52" y="410" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">last_seen_at</text><text x="52" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">ip_hash, user_agent</text><rect x="420" y="100" width="330" height="166" rx="10" fill="#171a21" stroke="#3a4150"/><rect x="420" y="100" width="330" height="30" rx="10" fill="#1e222b"/><text x="432" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#e8ecf3">bot_logs</text><text x="432" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#e8ecf3">id  BIGINT PK</text><text x="432" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">event_type  VARCHAR(64)</text><text x="432" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">event_data  JSON</text><text x="432" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">guild_id, user_id</text><text x="432" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">request_id</text><text x="432" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">timestamp  TIMESTAMP(3)</text><rect x="420" y="290" width="330" height="166" rx="10" fill="#171a21" stroke="#3a4150"/><rect x="420" y="290" width="330" height="30" rx="10" fill="#1e222b"/><text x="432" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#e8ecf3">bot_heartbeat</text><text x="432" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#e8ecf3">id  TINYINT PK (=1)</text><text x="432" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">bot_id, bot_name</text><text x="432" y="380" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">started_at</text><text x="432" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">heartbeat_at</text><text x="432" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">latency_ms</text><text x="432" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">guilds  JSON</text><rect x="800" y="100" width="330" height="106" rx="10" fill="#171a21" stroke="#3a4150"/><rect x="800" y="100" width="330" height="30" rx="10" fill="#1e222b"/><text x="812" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#e8ecf3">schema_migrations</text><text x="812" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#e8ecf3">version  VARCHAR(64) PK</text><text x="812" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">checksum  CHAR(64)</text><text x="812" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">applied_at</text><rect x="800" y="240" width="330" height="166" rx="10" fill="#171a21" stroke="#3a4150"/><rect x="800" y="240" width="330" height="30" rx="10" fill="#1e222b"/><text x="812" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#e8ecf3">guild_settings</text><text x="812" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#e8ecf3">guild_id  VARCHAR(32) PK</text><text x="812" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">prefix  VARCHAR(8)</text><text x="812" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">disabled_features  JSON</text><text x="812" y="350" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">quiet_channels  JSON</text><text x="812" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">units  ENUM</text><text x="812" y="390" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">owner_user_id</text><rect x="800" y="440" width="330" height="126" rx="10" fill="#171a21" stroke="#3a4150"/><rect x="800" y="440" width="330" height="30" rx="10" fill="#1e222b"/><text x="812" y="460" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#e8ecf3">quotes</text><text x="812" y="490" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#e8ecf3">id  INT PK</text><text x="812" y="510" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">text  VARCHAR(500) UNIQUE</text><text x="812" y="530" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">category</text><text x="812" y="550" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9aa4b2">added_by, created_at</text><path d="M 200 300 L 200 274" fill="none" stroke="#6aa9ff" stroke-width="1.6" marker-end="url(#ah-6aa9ff)"/><text x="212" y="292" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="10.5" fill="#9aa4b2" text-anchor="start" font-weight="400">1:n sessions</text><path d="M 370 120 L 420 120" fill="none" stroke="#9aa4b2" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-9aa4b2)"/><text x="395" y="140" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="10" fill="#9aa4b2" text-anchor="middle" font-weight="400">no FK</text><text x="40" y="470" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#9aa4b2" text-anchor="start" font-weight="400">Indexes: bot_logs(event_type,timestamp), (guild_id,timestamp), (user_id,timestamp), (timestamp).</text><text x="40" y="492" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#9aa4b2" text-anchor="start" font-weight="400">Retention: interaction 30 d · error 90 d · aggregate 180 d (DEC-016), pruned in 5,000-row batches.</text><text x="40" y="514" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#9aa4b2" text-anchor="start" font-weight="400">Heartbeat is a single upserted row; online state is derived in the API (age > 90 s → offline).</text><text x="40" y="536" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#9aa4b2" text-anchor="start" font-weight="400">Migrations are forward-only; 0001 adopts an existing pre-migration schema instead of failing.</text></svg>